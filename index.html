<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Vendite Realtime</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js per i grafici -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- SCHERMATA DI LOGIN -->
    <div id="login-screen" class="flex items-center justify-center flex-1 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <h1 class="text-2xl font-bold mb-6 text-center text-slate-900">Accesso Gestione Vendite</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="nome@azienda.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition">Accedi</button>
                <p id="login-error" class="text-red-500 text-sm text-center mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <!-- SCHERMATA PRINCIPALE DELL'APPLICAZIONE -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <!-- Header con Ruolo e Logout -->
        <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
            <h1 class="text-xl font-bold text-slate-900">Dashboard Aziendale <span id="user-role-badge" class="text-xs uppercase bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full ml-2"></span></h1>
            <button id="logout-btn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg transition">Esci</button>
        </header>

        <main class="p-6 max-w-7xl mx-auto w-full space-y-8 flex-1">
            
            <!-- Maschera di Inserimento (Visibile a tutti gli utenti loggati) -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-semibold mb-4 text-slate-800">Nuova Registrazione Vendita</h2>
                <form id="sale-form" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Data</label>
                        <input type="date" id="f-data" required class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Agente</label>
                        <input type="text" id="f-agente" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Nome Agente">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Regione</label>
                        <input type="text" id="f-regione" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Es. Lombardia">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Prodotto</label>
                        <input type="text" id="f-prodotto" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Nome Prodotto">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Quantità</label>
                        <input type="number" step="any" id="f-quantita" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Fatturato (€)</label>
                        <input type="number" step="any" id="f-fatturato" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">Cliente</label>
                        <input type="text" id="f-cliente" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Nome Cliente">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition">Registra Vendita</button>
                    </div>
                </form>
            </section>

            <!-- Dashboard Grafica (Visibile solo se ADMIN) -->
            <section id="admin-dashboard" class="hidden space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-800">Analisi e Statistiche (Realtime)</h2>
                    <!-- Filtri Combo -->
                    <div class="flex gap-4 w-full md:w-auto">
                        <select id="filter-agente" class="px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="">Tutti gli agenti</option>
                        </select>
                        <select id="filter-regione" class="px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="">Tutte le regioni</option>
                        </select>
                    </div>
                </div>

                <!-- Grafici -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                        <h3 class="text-sm font-semibold text-slate-600 mb-4 self-start">Fatturato per Agente</h3>
                        <div class="w-full h-64 flex justify-center items-center">
                            <canvas id="chartAgente"></canvas>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                        <h3 class="text-sm font-semibold text-slate-600 mb-4 self-start">Fatturato per Data</h3>
                        <div class="w-full h-64 flex justify-center items-center">
                            <canvas id="chartTrend"></canvas>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- LOGICA JAVASCRIPT INTEGRATA -->
    <script>
        // Configurazione Supabase
        const SB_URL = 'https://ozpifwimyatpoupbrwhq.supabase.co';
        const SB_KEY = 'sb_publishable_Fel_WHkiTWhP3FcokDzcSQ_phle1zNd';
        
        // Inizializzazione sicura con 'sb' per evitare qualsiasi conflitto di variabili
        const sb = window.supabase.createClient(SB_URL, SB_KEY);

        // Elementi DOM
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const saleForm = document.getElementById('sale-form');
        const adminDashboard = document.getElementById('admin-dashboard');
        const userRoleBadge = document.getElementById('user-role-badge');
        const filterAgente = document.getElementById('filter-agente');
        const filterRegione = document.getElementById('filter-regione');

        let currentUser = null;
        let userRole = 'user';
        let allSalesData = [];
        let chartAgenteInstance = null;
        let chartTrendInstance = null;

        // Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                loginError.textContent = "Errore: " + error.message;
                loginError.classList.remove('hidden');
            } else {
                checkUserSession();
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            await sb.auth.signOut();
            location.reload();
        });

        // Verifica Sessione e Ruolo
        async function checkUserSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                currentUser = session.user;
                
                // Cerca il ruolo utente nella tabella profiles usando maybeSingle()
                const { data: profile } = await sb
                    .from('profiles')
                    .select('role')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                userRole = profile ? profile.role : 'user';
                
                // Sblocca la schermata
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                userRoleBadge.textContent = userRole.toUpperCase();

                if (userRole === 'admin') {
                    adminDashboard.classList.remove('hidden');
                    initCharts();
                    loadSalesData();
                    setupRealtimeSubscription();
                }
            }
        }

        // Inserimento Vendita
        saleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newSale = {
                data: document.getElementById('f-data').value,
                agente: document.getElementById('f-agente').value,
                regione: document.getElementById('f-regione').value,
                prodotto: document.getElementById('f-prodotto').value,
                quantita: parseFloat(document.getElementById('f-quantita').value),
                fatturato: parseFloat(document.getElementById('f-fatturato').value),
                cliente: document.getElementById('f-cliente').value,
                user_id: currentUser.id
            };

            const { error } = await sb.from('sales').insert([newSale]);
            if (error) {
                alert('Errore durante la registrazione: ' + error.message);
            } else {
                saleForm.reset();
                document.getElementById('f-data').valueAsDate = new Date();
                alert('Vendita registrata con successo!');
            }
        });

        // Carica dati per la Dashboard Admin
        async function loadSalesData() {
            const { data, error } = await sb.from('sales').select('*').order('data', { ascending: true });
            if (!error) {
                allSalesData = data;
                updateFiltersOptions();
                renderDashboard();
            }
        }

        // Sottoscrizione Realtime
        function setupRealtimeSubscription() {
            sb.channel('public:sales')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sales' }, payload => {
                  allSalesData.push(payload.new);
                  updateFiltersOptions();
                  renderDashboard();
              })
              .subscribe();
        }

        // Popola i filtri a tendina
        function updateFiltersOptions() {
            const agenti = [...new Set(allSalesData.map(item => item.agente))];
            const regioni = [...new Set(allSalesData.map(item => item.regione))];

            const currentAgente = filterAgente.value;
            const currentRegione = filterRegione.value;

            filterAgente.innerHTML = '<option value="">Tutti gli agenti</option>' + agenti.map(a => `<option value="${a}">${a}</option>`).join('');
            filterRegione.innerHTML = '<option value="">Tutte le regioni</option>' + regioni.map(r => `<option value="${r}">${r}</option>`).join('');

            filterAgente.value = currentAgente;
            filterRegione.value = currentRegione;
        }

        filterAgente.addEventListener('change', renderDashboard);
        filterRegione.addEventListener('change', renderDashboard);

        // Inizializzazione Grafici Chart.js
        function initCharts() {
            const ctxAgente = document.getElementById('chartAgente').getContext('2d');
            chartAgenteInstance = new Chart(ctxAgente, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: 'Fatturato (€)', data: [], backgroundColor: '#6366f1' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctxTrend = document.getElementById('chartTrend').getContext('2d');
            chartTrendInstance = new Chart(ctxTrend, {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Fatturato per Data (€)', data: [], borderColor: '#10b981', tension: 0.1 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // Render e filtri della dashboard
        function renderDashboard() {
            if (userRole !== 'admin') return;

            const selectedAgente = filterAgente.value;
            const selectedRegione = filterRegione.value;

            const filteredData = allSalesData.filter(item => {
                return (selectedAgente === "" || item.agente === selectedAgente) &&
                       (selectedRegione === "" || item.regione === selectedRegione);
            });

            // Aggregazione Fatturato per Agente
            const agenteMap = {};
            filteredData.forEach(item => {
                agenteMap[item.agente] = (agenteMap[item.agente] || 0) + Number(item.fatturato);
            });

            chartAgenteInstance.data.labels = Object.keys(agenteMap);
            chartAgenteInstance.data.datasets[0].data = Object.values(agenteMap);
            chartAgenteInstance.update();

            // Aggregazione Fatturato per Data
            const dateMap = {};
            filteredData.forEach(item => {
                dateMap[item.data] = (dateMap[item.data] || 0) + Number(item.fatturato);
            });

            chartTrendInstance.data.labels = Object.keys(dateMap);
            chartTrendInstance.data.datasets[0].data = Object.values(dateMap);
            chartTrendInstance.update();
        }

        // Avvio controllo sessione all'apertura
        checkUserSession();
        const dateField = document.getElementById('f-data');
        if (dateField) dateField.valueAsDate = new Date();
    </script>
</body>
</html>
